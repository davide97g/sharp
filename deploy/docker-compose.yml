# sharp — production stack for a single VPS.
#
#   1. Copy .env.example to .env and set strong secrets + your domain(s).
#   2. docker compose up -d
#
# Caddy (below) is OPTIONAL: it terminates TLS and reverse-proxies the app + serves
# the landing page. If you already run a reverse proxy, delete the `caddy` service
# and publish sharp directly by uncommenting its `ports:` line.

services:
  # WebRTC SFU. Host networking avoids Docker NAT overhead for the UDP media
  # range. Caddy and sharp reach signaling/API through host.docker.internal.
  livekit:
    image: livekit/livekit-server:v1.13.1
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        prometheus:
          port: 6789
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        keys:
          ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
        turn:
          enabled: true
          domain: ${MEDIA_DOMAIN:?set MEDIA_DOMAIN in .env}
          udp_port: 3478
          tls_port: 5349
          cert_file: /etc/livekit/tls.crt
          key_file: /etc/livekit/tls.key
          ttl_seconds: 300
          relay_range_start: 30000
          relay_range_end: 30100
    volumes:
      - ${LIVEKIT_TURN_CERT_FILE:?set LIVEKIT_TURN_CERT_FILE in .env}:/etc/livekit/tls.crt:ro
      - ${LIVEKIT_TURN_KEY_FILE:?set LIVEKIT_TURN_KEY_FILE in .env}:/etc/livekit/tls.key:ro

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sharp
      POSTGRES_DB: sharp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharp -d sharp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage for file uploads. Point sharp at an external S3/R2/B2 instead
  # by removing this service and setting S3_* to your provider's values.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sharp}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-sharp} ${S3_SECRET_KEY}; do echo 'waiting for minio'; sleep 1; done;
      mc mb -p local/${S3_BUCKET:-sharp} || true;
      exit 0;
      "

  sharp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      livekit:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgres://sharp:${POSTGRES_PASSWORD}@postgres:5432/sharp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      LIVEKIT_URL: wss://${MEDIA_DOMAIN}
      LIVEKIT_INTERNAL_URL: http://host.docker.internal:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      PORT: 3000
      WEB_DIST: /app/web-dist
      SHARP_DISABLE_SIGNUP: ${SHARP_DISABLE_SIGNUP:-false}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Sharp}
      RUST_LOG: ${RUST_LOG:-info}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-sharp}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sharp}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ALLOW_HTTP: "true"
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      # VAPID keys auto-generate + persist on first startup (leave unset). Set
      # both to pin your own keypair; empty => auto-generate.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@sharp.app}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # APNs for the native macOS desktop app — inert unless all four are set.
      # Needs a paid Apple Developer account: Team ID, the .p8 auth key ID +
      # contents (or APNS_PRIVATE_KEY_PATH to a mounted file), and the app bundle
      # id. APNS_ENV=production targets api.push.apple.com (else sandbox).
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      # Alternative to APNS_PRIVATE_KEY: a path to the .p8 *inside the container*,
      # so it needs a bind mount of your own to resolve.
      APNS_PRIVATE_KEY_PATH: ${APNS_PRIVATE_KEY_PATH:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-dev.sharp.app}
      APNS_ENV: ${APNS_ENV:-production}
      # Expo push (mobile). Optional: pushes work unauthenticated without it.
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      # Password-reset email — self-service reset is inert (the "Forgot password?"
      # link is hidden) unless EMAIL_FROM plus one backend are set. Resend's HTTP
      # API is preferred (no outbound SMTP ports needed) and wins when both are
      # configured; EMAIL_FROM's domain must be verified in Resend.
      # APP_URL is the public web URL used in email links (else request origin).
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Only for pointing Resend at a mock in tests; defaults to api.resend.com.
      RESEND_BASE_URL: ${RESEND_BASE_URL:-}
      APP_URL: ${APP_URL:-}
      # SMTP fallback, used only when RESEND_API_KEY is empty. SMTP_PORT defaults
      # to 465 (implicit TLS); set SMTP_TLS=starttls for 587. SMTP_FROM is a legacy
      # alias for EMAIL_FROM, still read when EMAIL_FROM is unset.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-}
      # Sharpy AI assistant (OpenAI-compatible LLM + embeddings) — disabled when
      # AI_API_KEY is unset. Base URL works with OpenAI, DeepSeek, Ollama, etc.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-text-embedding-3-small}
      # Optional separate live-transcription provider. Leave empty to fall back to
      # the AI_* key/base URL above; set these to send audio elsewhere (e.g. OpenAI
      # for transcription while chat runs on a provider without audio support).
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-}
      TRANSCRIBE_BASE_URL: ${TRANSCRIBE_BASE_URL:-}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      # GIF search (server-side proxy). A key saved in Settings → Workspace takes
      # precedence; these are the env fallbacks. GIPHY is default, Tenor legacy.
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      TENOR_API_KEY: ${TENOR_API_KEY:-}
      # Duck GIF suggestions (DeepSeek LLM) — duck is disabled when unset.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # GitHub task sync (Phase 7) — inert without the webhook secret. GITHUB_REPOS
      # is an optional comma-separated owner/repo allowlist (all repos when unset).
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      # Google Calendar (Phase 5) — optional. Leave unset to disable calendar sync.
      # GOOGLE_REDIRECT_URI must exactly match a redirect registered on the OAuth
      # client, pointing at this API origin: https://<domain>/api/v1/calendar/google/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    # Expose sharp directly instead of going through Caddy by uncommenting:
    # ports:
    #   - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - sharp
    ports:
      - "80:80"
      - "443:443"
    environment:
      SHARP_DOMAIN: ${SHARP_DOMAIN}
      LANDING_DOMAIN: ${LANDING_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../landing/dist:/srv/landing:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pg_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
