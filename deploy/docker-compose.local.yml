# sharp — full local stack in Docker (no Rust/Node needed on your machine).
# Everything (server + web UI) is built inside Docker and served at :3000.
#
#   cd deploy
#   docker compose -f docker-compose.local.yml up --build
#
# First build compiles the Rust server (~5-10 min); later builds use the cache.
# App: http://localhost:3000

services:
  livekit:
    image: livekit/livekit-server:v1.13.1
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sharp
      POSTGRES_PASSWORD: sharp
      POSTGRES_DB: sharp
    volumes:
      - pg_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharp -d sharp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sharp
      MINIO_ROOT_PASSWORD: sharp-secret
    volumes:
      - minio_local_data:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 sharp sharp-secret; do echo 'waiting for minio'; sleep 1; done;
      mc mb -p local/sharp || true;
      exit 0;
      "

  sharp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://sharp:sharp@postgres:5432/sharp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      SHARP_DISABLE_SIGNUP: "false"
      WEBAUTHN_RP_ID: "localhost"
      WEBAUTHN_ORIGINS: "http://localhost:5173,http://localhost:3000"
      WEBAUTHN_RP_NAME: "Sharp"
      RUST_LOG: info
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: sharp
      S3_ACCESS_KEY: sharp
      S3_SECRET_KEY: sharp-secret
      S3_REGION: us-east-1
      S3_ALLOW_HTTP: "true"
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      APP_URL: ${APP_URL:-http://localhost:5173}
      # Sharpy AI assistant (OpenAI-compatible) — optional; disabled when unset.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-text-embedding-3-small}
      # Optional separate live-transcription provider. Leave empty to fall back to
      # the AI_* key/base URL above.
      TRANSCRIBE_API_KEY: ${TRANSCRIBE_API_KEY:-}
      TRANSCRIBE_BASE_URL: ${TRANSCRIBE_BASE_URL:-}
      TRANSCRIBE_MODEL: ${TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      # Password-reset email — optional; the reset flow is inert without a backend.
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-}
      # GIF search + duck suggestions — optional.
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      TENOR_API_KEY: ${TENOR_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      # Web push: VAPID keys auto-generate + persist on first startup when unset.
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@sharp.app}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # GitHub task sync — inert without the webhook secret. Needs a public tunnel
      # to reach localhost:3000/api/v1/integrations/github/webhook.
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      # Google Calendar (Phase 5) — optional. Set to a Google OAuth client with
      # redirect http://localhost:3000/api/v1/calendar/google/callback to test sync.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      livekit:
        condition: service_started

volumes:
  pg_local_data:
  minio_local_data:
